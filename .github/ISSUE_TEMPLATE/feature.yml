name: Feature request
description: Suggest an improvement to CipherChannels
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not share real invites, message contents, or raw encrypted messages in this request.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe what is difficult or missing and how it affects you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
    validations:
      required: true
