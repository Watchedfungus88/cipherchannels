name: Bug report
description: Report a problem with CipherChannels
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not share real invites, message contents, or raw encrypted messages. Replace them with placeholders in your report, logs, and screenshots.
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [Fabric, NeoForge]
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.21.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you expected, what happened instead, and how to reproduce it. Remove secrets from any logs.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other client mods
      description: Include the names and versions of any chat, logging, or UI mods you use.
  - type: checkboxes
    id: safety
    attributes:
      label: Before you submit
      options:
        - label: I removed real invites, message contents, and raw encrypted messages from the report and all attachments.
          required: true
